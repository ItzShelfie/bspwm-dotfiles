; Swindle-style polybar adapted for bspwm/X11 + Matugen.
include-file = ~/.config/polybar/colors.ini

[bar/main]
width = 40%
height = 20pt
offset-x = 30%
offset-y = 10
radius = 0
fixed-center = true
background = ${colors.bar-bg}
foreground = ${colors.main-accent-light}
line-size = 0
border-size = 0
padding-left = 1
padding-right = 1
module-margin = 1
font-0 = "Go Mono:size=9;2"
font-1 = "Symbols Nerd Font:size=10;2"
modules-left = arch bspwm
modules-center = date
modules-right = xkeyboard tray audio
cursor-click = pointer
cursor-scroll = ns-resize
enable-ipc = false
wm-restack = bspwm

[module/arch]
type = custom/text
label = "  "
label-font = 2
click-left = rofi -show drun

[module/bspwm]
type = internal/bspwm
pin-workspaces = true
inline-mode = false
enable-click = true
enable-scroll = true
label-focused = "󱓻"
label-focused-padding = 1
label-occupied = "%name%"
label-occupied-padding = 1
label-urgent = "%name%"
label-urgent-padding = 1
label-empty = 
label-empty-padding = 0

[module/date]
type = internal/date
interval = 5
date = %A %H:%M
date-alt = %d %B %Y
label = %date%

[module/audio]
type = custom/script
exec = wpctl get-volume @DEFAULT_AUDIO_SINK@ 2>/dev/null | grep -q MUTED && echo "" || echo ""
interval = 2
click-right = sh -lc 'if command -v pavucontrol >/dev/null 2>&1; then pavucontrol >/dev/null 2>&1 & disown; elif command -v pwvucontrol >/dev/null 2>&1; then pwvucontrol >/dev/null 2>&1 & disown; else kitty -e sh -lc "wpctl status; echo; read -r -p Press\ Enter\ to\ close..."; fi'
click-left = wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle

[module/xkeyboard]
type = internal/xkeyboard
blacklist-0 = num lock
blacklist-1 = scroll lock
label-layout = %layout%
label-layout-padding = 1

[module/tray]
type = internal/tray
tray-size = 60%
tray-spacing = 8px
