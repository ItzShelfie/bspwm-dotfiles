# bspwm draws the Matugen accent line (2px); picom's shader adds the dark
# terminal-theme line right after it. No shadows, glow, blur, fading, rounding.

backend = "glx";
vsync = false;
use-damage = true;
unredir-if-possible = false;

shadow = false;
fading = false;
corner-radius = 0;
frame-opacity = 1;
detect-client-opacity = false;
blur-background = false;

rules: ({
  match = "!override_redirect && !fullscreen && window_type != 'dock' && window_type != 'desktop' && class_g != 'polybar' && class_g != 'Polybar'";
  shader = {
    path = "shaders/double-border.glsl";
  };
});
