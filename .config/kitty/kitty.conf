font_family Go Mono
font_size 11.5
# Two-character breathing room around terminal contents.
window_padding_width 16

# Opaque background.
background_opacity 1.0

# Live Matugen wallpaper palette; reload applies to all existing windows.
include wallpaper-colors.conf

# End-4-style built-in Fish history suggestions; login shell remains Bash.
shell /usr/bin/fish

# Hide Kitty scroll bar; mouse/keyboard scrolling remains available.
scrollbar never
